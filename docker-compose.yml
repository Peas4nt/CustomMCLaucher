services:
  cmcl-server:
    image: ghcr.io/peas4nt/custommclaucher-server:latest
    container_name: cmcl-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - JWT_SECRET=cmcl_secure_production_secret_change_me
      - DATABASE_URL=file:/app/prisma/prod.db
      - CORS_ORIGIN=*
      - MODPACK_STORAGE_DIR=/app/storage
    volumes:
      # Mount only the database FILE (not the whole prisma/ dir - that would shadow schema.prisma)
      - ./data/prod.db:/app/prisma/prod.db
      - ./data/uploads:/app/uploads
      - ./data/storage:/app/storage
