[package]
name = "mc-launcher"
version = "0.6.0"
description = "Custom Minecraft Launcher with NeoForge auto-installer"
authors = ["Launcher Dev"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
craftping = { version = "0.7", features = ["sync"] }
dirs = "5"
sha2 = "0.10"
walkdir = "2"
uuid = { version = "1.10", features = ["v3", "v4"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
