[package]
name = "custom-mc-launcher"
version = "1.1.0"
description = "Custom Minecraft Launcher with differential modpack sync"
authors = ["CustomMCLauncher Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-shell = "2.0.0"
tauri-plugin-dialog = "2.0.0"
tauri-plugin-fs = "2.0.0"
tauri-plugin-os = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
sha2 = "0.10"
hex = "0.4"
zip = { version = "2.1", default-features = false, features = ["deflate"] }
walkdir = "2.5"
thiserror = "1.0"
fastnbt = "2.4"
flate2 = "1.0"
log = "0.4"
env_logger = "0.11"
dirs = "5.0"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
