name: "Release Client Packages"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (e.g. v1.1.0)"
        required: true
        default: "v1.1.0"

permissions:
  contents: write

jobs:
  build-and-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 1. Windows (x64: .msi & .exe)
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""

          # 2. Linux / Fedora / Ubuntu (.AppImage & .deb)
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ""

          # 3. macOS ARM64 Apple Silicon M1/M2/M3 (.dmg & .app)
          - os: macos-14
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./client/src-tauri -> target"

      # Linux dependencies for Tauri v2 & AppImage generation
      - name: Install Linux dependencies (Ubuntu/Debian runner)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Client NPM dependencies
        working-directory: ./client
        run: npm ci

      # Resolve the correct tag: push event = git tag, manual trigger = input value
      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "value=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "value=${{ inputs.release_tag }}" >> $GITHUB_OUTPUT
          fi
        shell: bash

      # Build client & draft/upload GitHub Release
      - name: Build Tauri Desktop Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: "./client"
          tagName: ${{ steps.tag.outputs.value }}
          releaseName: "CustomMCLauncher ${{ steps.tag.outputs.value }}"
          releaseBody: "Automated multi-platform client release for Windows, Linux (AppImage), and macOS (Apple Silicon ARM)."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
